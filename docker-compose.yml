services:
  app:
    build: .
    container_name: z-profile-app
    restart: unless-stopped
    networks:
      - z-profile-net

  nginx:
    image: nginx:1.27-alpine
    container_name: z-profile-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/static:ro
    depends_on:
      - app
    networks:
      - z-profile-net

networks:
  z-profile-net:
    driver: bridge
